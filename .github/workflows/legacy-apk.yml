name: Build legacy APK
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/legacy-apk.yml
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: responde_ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
      - run: flutter pub get
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: responde-ai-legacy
          path: responde_ai/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
